name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    name: Types and zero-warning lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:selftest
      - run: pnpm test:coverage
      - name: coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  database:
    name: PostgreSQL migration and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: ecofinance_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ecofinance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecofinance_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecofinance_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm test:integration --coverage
      - run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-ecofinance "pnpm test:rollback"
      - run: pnpm db:migrate
      - name: Repeat migration without changes
        run: pnpm db:migrate
      - name: Backup, restore and compare synthetic financial data
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$CONTAINER_ID" psql -U postgres -d ecofinance_ci -v ON_ERROR_STOP=1 < packages/db/tests/fixtures/recovery.sql
          docker exec "$CONTAINER_ID" pg_dump -U postgres -d ecofinance_ci --format=custom > "$RUNNER_TEMP/ecofinance.dump"
          docker exec "$CONTAINER_ID" createdb -U postgres ecofinance_restore
          docker exec -i "$CONTAINER_ID" pg_restore -U postgres -d ecofinance_restore --exit-on-error < "$RUNNER_TEMP/ecofinance.dump"
          docker exec -i "$CONTAINER_ID" psql -U postgres -d ecofinance_restore -v ON_ERROR_STOP=1 < packages/db/tests/fixtures/assert-recovery.sql
      - name: Verify complete financial graph and legacy recovery
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pnpm db:verify-recovery
      - name: Database coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-coverage
          path: coverage/integration/
          retention-days: 7
          if-no-files-found: error

  web:
    name: Production web, bundle privacy and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: demo-ecofinance
      FIRESTORE_DATABASE_ID: ecofinance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with synthetic canaries and scan client artifacts
        run: node scripts/security/build-with-canaries.mjs web
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-ecofinance "pnpm test:firebase && pnpm test:e2e"
      - name: playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    name: Production container (Cloud Run image)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag ecofinance-web:ci .
      - name: Verify non-root user and minimal contents
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' ecofinance-web:ci)"
          uid="$(docker run --rm --entrypoint id ecofinance-web:ci -u)"
          if [ "$user" != node ] || [ "$uid" = 0 ]; then echo "::error::image must run as non-root (user=$user uid=$uid)"; exit 1; fi
          docker run --rm --entrypoint sh ecofinance-web:ci -c '
            set -e
            test -f apps/next/server.js && test -d apps/next/.next/static && test -d apps/next/public
            for path in .env apps/next/.env apps/next/src packages/db/scripts apps/expo; do
              if [ -e "$path" ]; then echo "unexpected $path"; exit 1; fi
            done
            if command -v npm || command -v corepack; then echo "package managers must not ship"; exit 1; fi
            ! touch apps/next/server.js 2>/dev/null'
          docker run --rm -w /app/apps/next --entrypoint node ecofinance-web:ci -e \
            "require('firebase-admin/app'); require('@node-rs/argon2').hash('synthetic').then(() => console.log('native modules ok'))"
      - name: Document worker runs from the traced standalone files
        run: |
          # A PNG with a dot and a blank PDF page load pdf.js, the native canvas, the
          # tesseract.js WebAssembly and the Portuguese model as the import does, offline.
          docker run --rm --network none -w /app/apps/next --entrypoint node ecofinance-web:ci -e "
            const { Worker } = require('node:worker_threads');
            const { createCanvas } = require('@napi-rs/canvas');
            const canvas = createCanvas(64, 64), context = canvas.getContext('2d'); context.fillStyle = '#fff'; context.fillRect(0, 0, 64, 64); context.fillStyle = '#000'; context.fillRect(30, 30, 4, 4);
            const pdf = Buffer.from('%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj 2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj 3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF');
            const limits = { pages: 1, imagePixels: 1e6, renderPixels: 1e6 };
            const run = (bytes, format) => new Promise((resolve, reject) => {
              const worker = new Worker('/app/apps/next/workers/document-worker.mjs', { workerData: { bytes, format, limits, ocr: true }, stdout: true, stderr: true });
              worker.on('message', m => { if (m.type !== 'progress') { void worker.terminate(); m.type === 'result' && m.extraction.pages[0].method === 'ocr' ? resolve() : reject(new Error(m.code)); } });
              worker.on('error', reject);
            });
            Promise.all([run(canvas.toBuffer('image/png'), 'png'), run(pdf, 'pdf')]).then(() => console.log('document worker ok'), error => { console.error(error); process.exit(1); });"
      - name: Start container and require healthy /api/health
        run: |
          docker run --detach --name web --publish 8080:8080 --health-interval 2s \
            --env AUTH_URL=http://localhost:8080 --env AUTH_SECRET="$(openssl rand -hex 32)" \
            --env FIREBASE_PROJECT_ID=demo-ecofinance --env FIRESTORE_DATABASE_ID=ecofinance \
            --env FIRESTORE_EMULATOR_HOST=127.0.0.1:1 ecofinance-web:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' web)" = healthy ] || { docker logs web; exit 1; }
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/login
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://hostile.example' http://localhost:8080/api/health)"
          [ "$code" = 403 ] || { echo "::error::foreign Origin returned $code"; exit 1; }
      - name: Container logs
        if: failure()
        run: docker logs web || true

  mobile:
    name: Expo compatibility, Android native and Android/iOS privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecofinance_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:check
      - run: node scripts/security/build-with-canaries.mjs mobile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate local debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 365
      - name: Compile and lint the native Android application
        working-directory: apps/expo/android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon -PreactNativeArchitectures=x86_64

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes development dependencies; registry errors also fail the job.
      - run: pnpm security:audit

  secrets:
    name: Git history, working tree and source privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner'
      - name: Scan working tree before dependency installation
        if: success() || failure()
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'
      - name: Enforce source privacy policy
        if: success() || failure()
        run: node scripts/security/check-source.mjs

  codeql:
    name: Blocking CodeQL security and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          upload: never
          output: codeql-results
      - name: Fail on findings, suppressed findings or incomplete report
        run: node scripts/security/check-sarif.mjs codeql-results
      - name: codeql evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql
          path: codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: error

  react:
    name: React Doctor (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [apps/next, apps/expo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2
        id: doctor
        with:
          directory: ${{ matrix.directory }}
          scope: full
          blocking: warning
          version: '0.9.14'
          comment: 'false'
          review-comments: 'false'
          commit-status: 'false'
      # Upstream is advisory on push/merge_group; enforce zero findings on all events.
      - name: Enforce complete zero-finding scan for every event
        env:
          FINDINGS: ${{ steps.doctor.outputs.total-issues }}
        run: |
          node --input-type=module -e 'const n = process.env.FINDINGS; if (!/^0$/.test(n ?? "")) { console.error("React Doctor findings or incomplete scan:", n); process.exit(1); }'

  workflows:
    name: GitHub Actions validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed actionlint release
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" -color'

  gate:
    name: PR quality gate
    if: always()
    needs: [quality, unit, database, web, container, mobile, dependencies, secrets, codeql, react, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const checks = Object.entries(JSON.parse(process.env.RESULTS));
            for (const [name, check] of checks) console.log(name + ": " + check.result);
            if (checks.length !== 11 || checks.some(([, check]) => check.result !== "success")) process.exit(1);
          '
