version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Node só em linhas LTS: a troca de major (22 → 24) é decisão explícita,
      # alinhada a "engines" e à CI, nunca uma versão ímpar (Current) como 25.
      - dependency-name: node
        update-types: [version-update:semver-major]
